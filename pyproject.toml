[project]
name = "enterprise-ai-data-analyst"
version = "0.1.0"
description = "Local-first, secure conversational analytics for PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "pydantic>=2.8", "pydantic-settings>=2.3", "sqlglot>=25.0", "langgraph>=0.2",
  "httpx>=0.27", "prometheus-client>=0.20", "pandas>=2.2", "plotly>=5.23", "streamlit>=1.37"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "backend*", "database*", "evaluation*"]
exclude = ["tests*", "frontend*", "docker*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
