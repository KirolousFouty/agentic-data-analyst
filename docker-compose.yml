services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics_admin
      POSTGRES_PASSWORD: analytics_admin_password
    volumes: [postgres_data:/var/lib/postgresql/data, ./database/init.sql:/docker-entrypoint-initdb.d/01-security.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_admin -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3; ollama pull qwen2.5:0.5b; wait"]
  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, ollama: {condition: service_started}}
    volumes: [.:/app]
  frontend:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    depends_on: [api]
    volumes: [.:/app]
  adminer:
    image: adminer:4-standalone
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
volumes: {postgres_data: {}, ollama_data: {}}
